input {
  beats {
    port => 5044
  }
}

filter {

  # ---------------- nginx ----------------
  if [service][name] == "nginx" and [log_type] == "access" {
    grok {
      match => {
        "message" => '%{IPORHOST:[client][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[@metadata][ts]}\] "(?:%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?|%{DATA:[http][request][line]})" %{NUMBER:[http][response][status_code]:int} (?:%{NUMBER:[http][response][body][bytes]:int}|-) "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"'
      }
    }
    date {
      match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z"]
      locale => "en"
      target => "@timestamp"
    }
  }

  if [service][name] == "nginx" and [log_type] == "error" {
    grok {
      pattern_definitions => { "NGINX_ERR_TS" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}" }
      match => {
        "message" => '%{NGINX_ERR_TS:[@metadata][ts]} \[%{LOGLEVEL:[log][level]}\] %{POSINT:[process][pid]:int}#%{NONNEGINT:[process][thread][id]:int}: (?:\*%{POSINT:[nginx][connection_id]:int} )?%{DATA:[error][message]}(?:, client: %{IP:[client][ip]})?(?:, server: %{DATA:[nginx][server]})?(?:, request: "%{DATA:[nginx][request]}")?(?:, upstream: "%{DATA:[nginx][upstream]}")?(?:, host: "%{DATA:[nginx][host]}")?(?:, referrer: "%{DATA:[nginx][referrer]}")?$'
      }
    }
    date {
      match => ["[@metadata][ts]", "yyyy/MM/dd HH:mm:ss"]
      timezone => "UTC"
      target => "@timestamp"
    }
  }

  # ---------------- php-fpm ----------------
  if [service][name] == "php-fpm" and [log_type] == "access" {
    grok {
      match => {
        "message" => '%{IPORHOST:[client][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[@metadata][ts]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[php][duration_ms]:float} %{NUMBER:[php][memory_kb]:float}'
      }
    }
    date {
      match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z"]
      locale => "en"
      target => "@timestamp"
    }
  }

  if [service][name] == "php-fpm" and [log_type] == "error" {
    grok {
      pattern_definitions => { "PHP_ERR_TS" => "%{MONTHDAY}-%{MONTH}-%{YEAR} %{TIME}" }
      match => {
        "message" => '\[%{PHP_ERR_TS:[@metadata][ts]}\] %{LOGLEVEL:[log][level]}: %{GREEDYDATA:[error][message]}'
      }
    }
    date {
      match => ["[@metadata][ts]", "dd-MMM-yyyy HH:mm:ss"]
      locale => "en"
      timezone => "UTC"
      target => "@timestamp"
    }
  }

  # ---------------- mysql ----------------
  if [service][name] == "mysql" and [log_type] == "error" {
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:[@metadata][ts]} %{NONNEGINT:[mysql][thread_id]:int} \[%{DATA:[log][level]}\] \[%{DATA:[mysql][error_code]}\] \[%{DATA:[mysql][subsystem]}\] %{GREEDYDATA:[error][message]}'
      }
    }
    date {
      match => ["[@metadata][ts]", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [service][name] == "mysql" and [log_type] == "slowlog" {
    grok {
      match => {
        "message" => '(?m)# Time: %{TIMESTAMP_ISO8601:[@metadata][ts]}\n# User@Host: %{USER:[user][name]}\[%{DATA}\] @ %{DATA:[client][domain]} \[%{DATA:[client][address]}\]\s+Id:\s+%{NUMBER:[mysql][thread_id]:int}\n# Query_time: %{NUMBER:[mysql][query_time]:float}\s+Lock_time: %{NUMBER:[mysql][lock_time]:float}\s+Rows_sent: %{NUMBER:[mysql][rows_sent]:int}\s+Rows_examined: %{NUMBER:[mysql][rows_examined]:int}\n(?:use %{DATA:[mysql][database]};\n)?(?:SET timestamp=%{NUMBER:[mysql][timestamp]:int};\n)?%{GREEDYDATA:[mysql][query]}'
      }
    }
    date {
      match => ["[@metadata][ts]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    lowercase => ["[log][level]"]
  }
}

output {
  # ILM настроен прямо в выводе: запись идёт в rollover-алиас, политика создаётся заранее (scripts/setup-es.sh).
  # nginx и mysql - 30 дней, php-fpm - 14 дней.
  if [service][name] == "nginx" {
    elasticsearch {
      hosts => ["${ES_URL}"]
      data_stream => "false"
      manage_template => false
      ilm_enabled => "true"
      ilm_rollover_alias => "lab-nginx"
      ilm_policy => "lab-logs-30d"
    }
  } else if [service][name] == "php-fpm" {
    elasticsearch {
      hosts => ["${ES_URL}"]
      data_stream => "false"
      manage_template => false
      ilm_enabled => "true"
      ilm_rollover_alias => "lab-php-fpm"
      ilm_policy => "lab-logs-14d"
    }
  } else if [service][name] == "mysql" {
    elasticsearch {
      hosts => ["${ES_URL}"]
      data_stream => "false"
      manage_template => false
      ilm_enabled => "true"
      ilm_rollover_alias => "lab-mysql"
      ilm_policy => "lab-logs-30d"
    }
  }
}
