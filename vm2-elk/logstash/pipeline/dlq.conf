input {
  dead_letter_queue {
    path => "/usr/share/logstash/data/dlq"
    pipeline_id => "main"
    commit_offsets => true
  }
}

filter {
  mutate {
    add_field => {
      "[dlq][reason]"      => "%{[@metadata][dead_letter_queue][reason]}"
      "[dlq][plugin_type]" => "%{[@metadata][dead_letter_queue][plugin_type]}"
      "[dlq][entry_time]"  => "%{[@metadata][dead_letter_queue][entry_time]}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_URL}"]
    index => "lab-dlq-%{+YYYY.MM.dd}"
    data_stream => "false"
    ilm_enabled => "false"
    manage_template => false
  }
}
